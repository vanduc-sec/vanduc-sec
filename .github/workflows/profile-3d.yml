
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: vanduc-sec

      - name: Remove radar chart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          folder = Path("profile-3d-contrib")
          source = folder / "profile-green-animate.svg"
          output = folder / "profile-green-no-radar.svg"

          ns = "http://www.w3.org/2000/svg"
          ET.register_namespace("", ns)
          tree = ET.parse(source)
          root = tree.getroot()

          radar = [
              g for g in root.findall(f"{{{ns}}}g")
              if g.get("transform", "").replace(" ", "")
              == "translate(980,284.5)"
          ]

          if len(radar) != 1:
              raise RuntimeError("Radar group not found")

          root.remove(radar[0])
          tree.write(
              output,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
