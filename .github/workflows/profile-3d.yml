
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  DAYS: "60"
  BAR_SCALE: "1.5"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Checkout 3D generator
        uses: actions/checkout@v5
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: main
          path: _3d_source
          persist-credentials: false

      - name: Customize 3D graph
        run: |
          python3 - <<'PY'
          from pathlib import Path

          folder = Path("_3d_source/src")

          def replace_once(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"Unexpected source structure: {path}"
                  )
              path.write_text(text.replace(old, new))

          # Limit calendar to the last DAYS days
          replace_once(
              folder / "index.ts",
              "const userInfo = aggregate.aggregateUserInfo(response);",
              """const userInfo = aggregate.aggregateUserInfo(response);
                  const days = Number(process.env.DAYS || 60);
                  if (!Number.isInteger(days) || days < 1 || days > 365) {
                      throw new Error('DAYS must be between 1 and 365');
                  }
                  userInfo.contributionCalendar =
                      userInfo.contributionCalendar.slice(-days);
                  userInfo.totalContributions =
                      userInfo.contributionCalendar.reduce(
                          (sum, day) => sum + day.contributionCount, 0
                      );"""
          )

          # Adapt grid spacing to the selected number of days
          replace_once(
              folder / "create-3d-contrib.ts",
              "const dx = width / 64;",
              "const dx = width / (weekcount + 12);"
          )

          # Increase bar height
          replace_once(
              folder / "create-3d-contrib.ts",
              "Math.log10(cal.contributionCount / 20 + 1) * 144 + 3",
              """Math.log10(cal.contributionCount / 20 + 1)
                  * 144 * Number(process.env.BAR_SCALE || 1.8) + 3"""
          )

          # Remove the radar chart
          path = folder / "create-svg.ts"
          text = path.read_text()
          start = text.index("        // radar chart\n")
          end = text.index("        // pie chart\n", start)
          path.write_text(text[:start] + text[end:])

          # Move language chart to the upper right
          replace_once(
              path,
              "            40,\n            height - pieHeight - 70,",
              "            width - pieWidth - 40,\n            55,"
          )

          print("3D generator customized successfully")
          PY

     
      - name: Build and generate SVG
        working-directory: _3d_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: vanduc-sec
        run: |
          npm ci
          npx ts-node src/index.ts

      - name: Copy custom graph
        run: |
          mkdir -p profile-3d-contrib
          cp \
            _3d_source/profile-3d-contrib/profile-green-animate.svg \
            profile-3d-contrib/profile-green-recent.svg

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/profile-green-recent.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution graph"
            git push
          fi
